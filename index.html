<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1116">
<title>영단어 퀴즈 — 공무원 영어</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ══════════ 홈 ══════════ -->
  <section id="screen-home" class="screen is-active">
    <header class="site-head">
      <h1>영단어 퀴즈</h1>
      <!-- 세트 구성은 app.js가 채운다 (세트를 늘려도 문구가 낡지 않게) -->
      <p class="site-sub" id="head-sub"></p>
    </header>

    <!-- 오늘 현황 — 한 줄 -->
    <p class="today" id="today-line"></p>

    <!-- 진척도 — 바 하나 + 숫자 하나 -->
    <div class="prog">
      <div class="prog-top">
        <span class="prog-label">마스터</span>
        <span class="prog-val"><b id="stat-mastered">0</b><span id="stat-total">/ 0</span></span>
      </div>
      <div class="bar"><i id="bar-mastered"></i><i id="bar-studied"></i></div>
      <div class="prog-legend">
        <span><i class="dot dot-ok"></i>마스터</span>
        <span><i class="dot dot-ac"></i>학습 중 <b id="stat-studied">0</b></span>
      </div>
    </div>

    <!-- 주역 -->
    <button type="button" id="conquer-card" class="hero" data-go="sets">
      <span class="hero-row">
        <b>정복 모드</b>
        <span class="hero-n" id="conquer-n"></span>
      </span>
      <span class="hero-sub">세트 → 챕터(20단어) → 4지선다 + 문장 빈칸 + 짝 맞추기</span>
    </button>

    <!-- 오답 복습 — 틀린 것이 있을 때만 나타난다 -->
    <button type="button" id="wrong-card" class="hero hero-alt" data-go="wrong" style="display:none">
      <span class="hero-row">
        <b>오답 노트</b>
        <span class="hero-n" id="wrong-card-n"></span>
      </span>
      <span class="hero-sub">틀린 단어만 모아 다시 풀기 · 맞히면 목록에서 사라집니다</span>
    </button>

    <!-- 개별 연습 — 형식을 먼저 고르고, 다음 화면에서 세트를 고른다 -->
    <h2 class="section-title">개별 연습</h2>
    <div id="mode-list" class="rows"></div>
    <p class="set-note">형식을 고르면 세트(A · B)를 선택할 수 있습니다. 한 세트를 통째로 풀며, 진행 바를 드래그해 원하는 문제로 이동할 수 있습니다.</p>

    <!-- 하단 -->
    <nav class="foot-nav">
      <button class="link-btn" data-go="wrong">오답 노트<span id="wrong-badge" class="badge">0</span></button>
      <button class="link-btn" data-go="words">단어장</button>
    </nav>
  </section>

  <!-- ══════════ 개별 연습 세트 목록 ══════════ -->
  <section id="screen-mode-sets" class="screen">
    <div class="sub-head">
      <button class="icon-btn" data-go="home" aria-label="뒤로">‹</button>
      <h2 id="mode-sets-title">4지선다</h2>
      <span class="head-n" id="mode-sets-n"></span>
    </div>
    <p class="site-sub pad" id="mode-sets-note"></p>
    <div id="mode-set-list" class="list"></div>
  </section>

  <!-- ══════════ 정복 세트 목록 ══════════ -->
  <section id="screen-sets" class="screen">
    <div class="sub-head">
      <button class="icon-btn" data-go="home" aria-label="뒤로">‹</button>
      <h2>정복 모드</h2>
    </div>
    <p class="site-sub pad">세트를 골라 20단어씩 정복합니다.</p>
    <div id="set-list" class="list"></div>
  </section>

  <!-- ══════════ 정복 챕터 목록 ══════════ -->
  <section id="screen-chapters" class="screen">
    <div class="sub-head">
      <button class="icon-btn" id="btn-back-sets" aria-label="뒤로">‹</button>
      <h2 id="chapters-title">A 세트</h2>
    </div>
    <button type="button" class="btn btn-review" id="btn-set-review" style="display:none"></button>
    <div id="chapter-list" class="list"></div>
  </section>

  <!-- ══════════ 퀴즈 ══════════ -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-head">
      <button class="icon-btn" id="btn-quit" aria-label="그만두기">✕</button>
      <span id="quiz-mode-name" class="quiz-name"></span>
      <span id="quiz-progress" class="quiz-count"></span>
    </div>
    <div class="bar bar-quiz" id="quiz-bar-wrap"><i id="quiz-bar"></i></div>
    <div id="scrub-mag" class="scrub-mag">
      <div class="scrub-num" id="scrub-num"></div>
      <div class="scrub-word" id="scrub-word"></div>
      <div class="scrub-ruler" id="scrub-ruler"></div>
    </div>
    <div id="conquer-grid" class="cgrid"></div>
    <div id="quiz-body" class="quiz-body"></div>
    <div id="quiz-feedback" class="feedback"></div>
    <div id="quiz-nav" class="qnav">
      <button type="button" class="qnav-btn" id="nav-prev">‹ 이전 문제</button>
      <span class="qnav-mid" id="nav-mid"></span>
      <button type="button" class="qnav-btn is-next" id="nav-next">다음 문제 ›</button>
    </div>
  </section>

  <!-- ══════════ 묶음 완료 ══════════ -->
  <section id="screen-block" class="screen">
    <div class="result-head">
      <div class="ring" id="block-badge">0 / 0</div>
      <h2 id="block-title">묶음 완료</h2>
      <p id="block-sub" class="site-sub"></p>
    </div>
    <div id="block-words" class="panel"></div>
    <div class="stack">
      <button class="btn btn-primary" id="btn-retry-block" style="display:none"></button>
      <button class="btn btn-ghost" id="btn-next-block">다음 묶음 시작</button>
      <button class="btn btn-ghost" data-go="home">홈으로</button>
    </div>
  </section>

  <!-- ══════════ 결과 ══════════ -->
  <section id="screen-result" class="screen">
    <div class="result-head">
      <div class="ring" id="score-ring"><span id="score-pct">0%</span></div>
      <h2 id="result-title">세션 완료</h2>
      <p id="result-sub" class="site-sub"></p>
    </div>
    <div id="result-wrong" class="panel"></div>
    <div class="stack">
      <button class="btn btn-primary" id="btn-retry-result" style="display:none"></button>
      <button class="btn btn-ghost" id="btn-again">같은 모드로 한 번 더</button>
      <button class="btn btn-ghost" data-go="home">홈으로</button>
    </div>
  </section>

  <!-- ══════════ 오답 노트 ══════════ -->
  <section id="screen-wrong" class="screen">
    <div class="sub-head">
      <button class="icon-btn" data-go="home" aria-label="뒤로">‹</button>
      <h2>오답 노트</h2>
      <span class="head-n" id="wrong-count"></span>
    </div>
    <p class="site-sub pad">틀린 단어만 모아 다시 출제합니다. 맞히면 목록에서 사라집니다.</p>
    <button type="button" class="btn btn-primary" id="btn-wrong-mixed" style="display:none"></button>
    <p class="section-title" id="wrong-modes-label" style="display:none">한 가지 형식으로만 풀기</p>
    <div id="wrong-modes" class="chip-row pad"></div>
    <div id="wrong-list" class="list"></div>
  </section>

  <!-- ══════════ 단어장 ══════════ -->
  <section id="screen-words" class="screen">
    <div class="sub-head">
      <button class="icon-btn" data-go="home" aria-label="뒤로">‹</button>
      <h2>단어장</h2>
    </div>

    <div class="hm">
      <div class="hm-label">최근 2주 학습량</div>
      <div class="heatmap" id="heatmap" aria-label="최근 2주 학습량"></div>
    </div>

    <div class="chip-row pad" id="word-filters"></div>
    <p id="word-count" class="site-sub pad"></p>
    <div id="word-list" class="list"></div>
    <button class="btn btn-quiet" id="btn-reset">학습 기록 초기화</button>
  </section>

</div>

<!-- 데이터는 quizgen/conquer보다 먼저 로드돼야 한다.
     quizgen.js가 로드 시점에 합집합을, conquer.js가 SETS를 만든다. -->
<script src="js/data/words.js"></script>
<script src="js/data/words-b.js"></script>
<script src="js/store.js"></script>
<script src="js/quizgen.js"></script>
<script src="js/conquer.js"></script>
<script src="js/modes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
