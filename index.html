<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>영단어 퀴즈 — 공무원 영어</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ══════════ 홈 ══════════ -->
  <section id="screen-home" class="screen is-active">
    <header class="site-head">
      <div>
        <h1>영단어 퀴즈</h1>
        <p class="site-sub">공무원 영어 · C1~C2 어휘</p>
      </div>
      <div class="head-stats">
        <div class="stat"><span id="stat-streak">0</span><em>연속일</em></div>
        <div class="stat"><span id="stat-today">0</span><em>오늘</em></div>
      </div>
    </header>

    <div class="card progress-card">
      <div class="progress-row">
        <div class="pnum"><strong id="stat-mastered">0</strong><span>마스터</span></div>
        <div class="pnum"><strong id="stat-studied">0</strong><span>학습</span></div>
        <div class="pnum"><strong id="stat-total">0</strong><span>전체</span></div>
      </div>
      <div class="bar"><i id="bar-mastered"></i><i id="bar-studied"></i></div>
      <div class="heatmap" id="heatmap" aria-label="최근 2주 학습량"></div>
    </div>

    <h2 class="section-title">모드 선택</h2>
    <div id="mode-list" class="mode-list"></div>

    <div class="card setting-card">
      <div class="setting-label">문제 수</div>
      <div id="count-picker" class="chip-row"></div>
    </div>

    <div class="home-actions">
      <button class="btn btn-ghost" data-go="wrong">오답 노트 <span id="wrong-badge" class="badge">0</span></button>
      <button class="btn btn-ghost" data-go="words">단어장</button>
    </div>
    <button class="btn btn-quiet" id="btn-reset">학습 기록 초기화</button>
  </section>

  <!-- ══════════ 퀴즈 ══════════ -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-head">
      <button class="icon-btn" id="btn-quit" aria-label="그만두기">✕</button>
      <div class="quiz-meta"><span id="quiz-mode-name"></span><span id="quiz-progress"></span></div>
    </div>
    <div class="bar bar-quiz"><i id="quiz-bar"></i></div>
    <div id="quiz-body" class="quiz-body"></div>
    <div id="quiz-feedback" class="feedback"></div>
  </section>

  <!-- ══════════ 결과 ══════════ -->
  <section id="screen-result" class="screen">
    <div class="result-head">
      <div class="score-ring" id="score-ring"><span id="score-pct">0%</span></div>
      <h2 id="result-title">세션 완료</h2>
      <p id="result-sub" class="site-sub"></p>
    </div>
    <div id="result-wrong" class="card"></div>
    <div class="stack">
      <button class="btn btn-primary" id="btn-again">같은 모드로 한 번 더</button>
      <button class="btn btn-ghost" data-go="home">홈으로</button>
    </div>
  </section>

  <!-- ══════════ 오답 노트 ══════════ -->
  <section id="screen-wrong" class="screen">
    <div class="sub-head">
      <button class="icon-btn" data-go="home" aria-label="뒤로">‹</button>
      <h2>오답 노트</h2>
    </div>
    <p class="site-sub pad">틀린 단어만 모아 다시 출제합니다. 맞히면 목록에서 사라집니다.</p>
    <div id="wrong-modes" class="chip-row pad"></div>
    <div id="wrong-list" class="list"></div>
  </section>

  <!-- ══════════ 단어장 ══════════ -->
  <section id="screen-words" class="screen">
    <div class="sub-head">
      <button class="icon-btn" data-go="home" aria-label="뒤로">‹</button>
      <h2>단어장</h2>
    </div>
    <div class="chip-row pad" id="word-filters"></div>
    <div id="word-count" class="site-sub pad"></div>
    <div id="word-list" class="list"></div>
  </section>

</div>

<script src="js/data/words.js"></script>
<script src="js/store.js"></script>
<script src="js/quizgen.js"></script>
<script src="js/modes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
